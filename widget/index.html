<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NDC Transport Tracker</title>
<link rel="stylesheet" href="../assets/design-tokens.css">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: var(--ct-font);
    color: var(--ct-text);
    background: transparent;
  }

  .widget {
    background: #EAF6F8;
    border-radius: var(--ct-radius-lg);
    padding: 24px 28px 20px;
  }

  .widget__header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 4px;
  }

  .widget__logo {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    object-fit: cover;
    flex-shrink: 0;
  }

  .widget__title {
    font-size: 14px;
    font-weight: 800;
    color: var(--ct-navy);
  }

  .widget__date {
    font-size: 13px;
    font-style: italic;
    color: var(--ct-muted);
    margin: 2px 0 16px 44px;
  }

  .widget__body {
    display: grid;
    grid-template-columns: 3fr 2fr;
    gap: 14px;
    align-items: stretch;
  }

  /* Stats (left) */
  .stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
  }

  .stat-card {
    background: var(--ct-surface);
    border-radius: var(--ct-radius-md);
    padding: 14px 16px;
    box-shadow: var(--ct-shadow-sm);
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .stat-card__label {
    font-size: 12.5px;
    color: var(--ct-muted);
    line-height: 1.35;
    min-height: 2.4em;
  }

  .stat-card__value {
    font-size: 32px;
    font-weight: 700;
    color: var(--ct-navy);
    line-height: 1;
  }

  .stat-card__of {
    font-size: 12px;
    color: var(--ct-muted);
  }

  .stat-card__bar-wrap {
    margin-top: 4px;
    height: 8px;
    background: var(--ct-border);
    border-radius: 99px;
    overflow: hidden;
  }

  .stat-card__bar {
    height: 100%;
    background: var(--ct-green);
    border-radius: 99px;
    width: 0%;
    transition: width 1.1s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .stat-card__pct {
    font-size: 12px;
    font-weight: 700;
    color: var(--ct-green-dark);
  }

  /* Nav tiles (right) */
  .nav-tiles {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .nav-tile {
    flex: 1;
    background: var(--ct-surface);
    border-radius: var(--ct-radius-md);
    box-shadow: var(--ct-shadow-sm);
    padding: 14px 16px;
    display: flex;
    align-items: center;
    gap: 14px;
    text-decoration: none;
    color: inherit;
    border: 1.5px solid transparent;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }

  .nav-tile:hover {
    border-color: var(--ct-teal);
    box-shadow: var(--ct-shadow-md);
  }

  .nav-tile:focus-visible {
    outline: 3px solid var(--ct-teal);
    outline-offset: 2px;
  }

  .nav-tile__icon {
    flex-shrink: 0;
    width: 40px;
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .nav-tile__title {
    font-size: 14px;
    font-weight: 700;
    color: var(--ct-navy);
  }

  .nav-tile__sub {
    font-size: 12px;
    color: var(--ct-muted);
    margin-top: 2px;
  }

  .nav-tile__arrow {
    margin-left: auto;
    flex-shrink: 0;
    color: var(--ct-muted);
    transition: transform 0.15s ease;
  }

  .nav-tile:hover .nav-tile__arrow {
    transform: translateX(3px);
    color: var(--ct-teal);
  }

  /* Explore button */
  .widget__footer {
    margin-top: 16px;
    display: flex;
    justify-content: flex-end;
  }

  .btn-explore {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: var(--ct-navy);
    color: #fff;
    font-family: var(--ct-font);
    font-size: 14px;
    font-weight: 600;
    padding: 9px 20px;
    border-radius: 99px;
    text-decoration: none;
    border: none;
    cursor: pointer;
    transition: background 0.15s ease, transform 0.1s ease;
  }

  .btn-explore:hover {
    background: var(--ct-navy-light);
    transform: translateY(-1px);
  }

  .btn-explore:focus-visible {
    outline: 3px solid var(--ct-teal);
    outline-offset: 2px;
  }

  /* Responsive */
  @media (max-width: 680px) {
    .widget__body { grid-template-columns: 1fr; }
    .stats { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div class="widget">
  <div class="widget__header">
    <img class="widget__logo" src="tracker.jpg" alt="" aria-hidden="true">
    <span class="widget__title">NDC Transport Tracker</span>
  </div>
  <p class="widget__date" id="asOfDate">As of —</p>

  <div class="widget__body">

    <div class="stats" id="stats"></div>

    <div class="nav-tiles">

      <a class="nav-tile"
         href="https://changing-transport.org/tracker/"
         target="_blank" rel="noopener"
         aria-label="Country explorer — NDC Transport Tracker, Changing Transport">
        <span class="nav-tile__icon" aria-hidden="true">
          <svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="20" cy="20" r="13" stroke="#00A4BD" stroke-width="2"/>
            <path d="M7 20h26" stroke="#00A4BD" stroke-width="1.4" stroke-dasharray="2 2"/>
            <path d="M9 14h22M9 26h22" stroke="#00A4BD" stroke-width="1" stroke-dasharray="2 2" opacity=".5"/>
            <path d="M20 7c5 4 5 22 0 26C15 29 15 11 20 7Z" stroke="#00A4BD" stroke-width="1.4"/>
            <circle cx="20" cy="20" r="3.5" fill="#00A4BD"/>
            <circle cx="20" cy="20" r="1.5" fill="#fff"/>
          </svg>
        </span>
        <span class="nav-tile__text">
          <p class="nav-tile__title">Country explorer</p>
          <p class="nav-tile__sub">Browse 199 country profiles</p>
        </span>
        <span class="nav-tile__arrow" aria-hidden="true">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
            <path d="M3 8h10M13 8l-4-4M13 8l-4 4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </span>
      </a>

      <a class="nav-tile"
         href="https://changing-transport.org/tracker/compare-ndc"
         target="_blank" rel="noopener">
        <span class="nav-tile__icon" aria-hidden="true">
          <svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="7"  y="22" width="7" height="12" rx="1.5" fill="none" stroke="#E8821A" stroke-width="2"/>
            <rect x="17" y="13" width="7" height="21" rx="1.5" fill="none" stroke="#E8821A" stroke-width="2"/>
            <rect x="27" y="18" width="6" height="16" rx="1.5" fill="none" stroke="#E8821A" stroke-width="2"/>
            <path d="M10.5 19 L20.5 10 L30 15" stroke="#003D5C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="10.5" cy="19" r="2" fill="#003D5C"/>
            <circle cx="20.5" cy="10" r="2" fill="#003D5C"/>
            <circle cx="30"   cy="15" r="2" fill="#003D5C"/>
          </svg>
        </span>
        <span class="nav-tile__text">
          <p class="nav-tile__title">Compare NDCs</p>
          <p class="nav-tile__sub">See how countries stack up</p>
        </span>
        <span class="nav-tile__arrow" aria-hidden="true">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
            <path d="M3 8h10M13 8l-4-4M13 8l-4 4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </span>
      </a>

    </div>
  </div>

  <div class="widget__footer">
    <a class="btn-explore"
       href="https://changing-transport.org/tracker/"
       target="_blank" rel="noopener">
      Explore the Tracker
      <svg width="15" height="15" viewBox="0 0 15 15" fill="none" aria-hidden="true">
        <path d="M2.5 7.5h10M12.5 7.5l-4-4M12.5 7.5l-4 4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </a>
  </div>
</div>

<script>
  var DATA_URL = 'widget-summary.json';

  var FALLBACK = {
    as_of: '10 April 2026',
    stats: [
      { label: 'NDCs 3.0 submitted',    value: 117, of: 'of 169 NDCs', pct: 69 },
      { label: 'With transport targets', value: 69,  of: 'of 117 NDCs', pct: 59 },
      { label: 'With transport measures', value: 96, of: 'of 117 NDCs', pct: 82 }
    ]
  };

  function notifyHeight() {
    var h = document.documentElement.scrollHeight;
    window.parent.postMessage({ iframeHeight: h }, '*');
  }

  function renderStats(data) {
    document.getElementById('asOfDate').textContent = 'As of ' + data.as_of;

    var container = document.getElementById('stats');
    container.innerHTML = '';

    data.stats.forEach(function(s) {
      var card = document.createElement('div');
      card.className = 'stat-card';
      card.innerHTML =
        '<p class="stat-card__label">' + s.label + '</p>' +
        '<p class="stat-card__value">' + s.value + '</p>' +
        '<p class="stat-card__of">' + s.of + '</p>' +
        '<div class="stat-card__bar-wrap"><div class="stat-card__bar" data-pct="' + s.pct + '"></div></div>' +
        '<p class="stat-card__pct">' + s.pct + '%</p>';
      container.appendChild(card);
    });

    // Animate bars after paint
    requestAnimationFrame(function() {
      requestAnimationFrame(function() {
        document.querySelectorAll('.stat-card__bar').forEach(function(bar) {
          bar.style.width = bar.dataset.pct + '%';
        });
      });
    });

    // Notify parent of height after bar animation completes (1.1s)
    setTimeout(notifyHeight, 1200);
  }

  fetch(DATA_URL)
    .then(function(res) {
      if (!res.ok) throw new Error('bad response');
      return res.json();
    })
    .then(renderStats)
    .catch(function() { renderStats(FALLBACK); });

  // Re-notify on resize (e.g. window narrowing on mobile)
  window.addEventListener('resize', notifyHeight);
</script>

</body>
</html>
